services:
  osrm:
    image: ${OSRM_DOCKER_IMAGE:-osrm/osrm-backend:latest}
    container_name: bexlogix-osrm
    command: osrm-routed --algorithm mld /data/tehran-latest.osrm
    volumes:
      - ../../offline/osrm/data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - 'http://127.0.0.1:5000/nearest/v1/driving/51.3890,35.6892?number=1' | grep -q '\"code\":\"Ok\"' || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  tiles:
    image: ${TILE_DOCKER_IMAGE:-maptiler/tileserver-gl:latest}
    container_name: bexlogix-tiles
    volumes:
      - ../../offline/tiles/data:/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1:8080/styles.json' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
